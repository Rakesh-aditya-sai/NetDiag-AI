<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetDiag AI - Network Troubleshooting Assistant</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🛜 NetDiag AI</h1>
  <p class="subtitle">Network Troubleshooting Assistant</p>
</header>

<main>
  <nav class="tabs">
    <button class="tab-btn active" data-tab="diagnose">Diagnose</button>
    <button class="tab-btn" data-tab="history">History</button>
    <button class="tab-btn" data-tab="monitors">Monitors</button>
  </nav>

  <section id="tab-diagnose" class="tab-panel">
    <section class="card">
      <label for="target">Device IP or FQDN</label>
      <input id="target" type="text" placeholder="e.g. 8.8.8.8 or example.com" autocomplete="off">

      <div class="checks">
        <label><input type="checkbox" value="connectivity" checked> Connectivity (Ping)</label>
        <label><input type="checkbox" value="dns" checked> DNS Resolution</label>
        <label><input type="checkbox" value="firewall" checked> Firewall / Port Check</label>
        <label><input type="checkbox" value="traceroute" checked> Traceroute</label>
        <label><input type="checkbox" value="cloud" checked> Cloud / HTTP(S) Reachability</label>
        <label><input type="checkbox" value="ssh" id="sshCheckbox"> SSH Remote Check</label>
      </div>

      <label for="customPorts">Custom ports to check (optional, comma-separated)</label>
      <input id="customPorts" type="text" placeholder="e.g. 8080, 8443, 9000" autocomplete="off">

      <div id="sshFields" class="ssh-fields" hidden>
        <label for="sshUsername">SSH username</label>
        <input id="sshUsername" type="text" placeholder="e.g. admin" autocomplete="off">
        <label for="sshPassword">SSH password (used once, never saved)</label>
        <input id="sshPassword" type="password" placeholder="password" autocomplete="off">
        <label for="sshPort">SSH port (default 22)</label>
        <input id="sshPort" type="text" placeholder="22" autocomplete="off">
      </div>

      <button id="runBtn">Run Diagnostics</button>
      <p id="errorMsg" class="error" hidden></p>
    </section>

    <section id="resultsSection" class="card" hidden>
      <div class="results-header">
        <h2>Results for <span id="resultTarget"></span></h2>
        <button id="exportBtn">Download Report</button>
      </div>
      <div id="resultsList"></div>

      <div class="suggestions">
        <h3>Suggested Next Steps</h3>
        <ul id="suggestionsList"></ul>
      </div>
    </section>

    <div id="spinner" hidden>Running diagnostics…</div>
  </section>

  <section id="tab-history" class="tab-panel" hidden>
    <section class="card">
      <div class="results-header">
        <h2>Past Runs</h2>
        <button id="clearHistoryBtn">Clear History</button>
      </div>
      <div id="historyList"></div>
    </section>
  </section>

  <section id="tab-monitors" class="tab-panel" hidden>
    <section class="card">
      <label for="monitorTarget">Target to monitor</label>
      <input id="monitorTarget" type="text" placeholder="e.g. 8.8.8.8 or example.com" autocomplete="off">
      <label for="monitorInterval">Check every (minutes)</label>
      <input id="monitorInterval" type="text" placeholder="15" autocomplete="off">
      <button id="addMonitorBtn">Add Monitor</button>
      <p id="monitorErrorMsg" class="error" hidden></p>
    </section>

    <section class="card">
      <h2>Active Monitors</h2>
      <div id="monitorsList"></div>
    </section>

    <section class="card">
      <h2>Alerts</h2>
      <div id="alertsList"></div>
    </section>
  </section>
</main>

<footer>
  <p>Runs locally — accessible to any device on your network at this host's address.</p>
</footer>

<script src="app.js"></script>
</body>
</html>
